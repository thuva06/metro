<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metro">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app.css?v=24">
<title>Metro</title>
</head>
<body>
<div id="aura"><i></i><i></i><i></i></div>
<div id="offline" hidden></div>
<main id="start" class="screen">
  <header class="top"><div class="brand">metro</div><div class="status" id="status"></div></header>
  <div id="startBody"></div>
  <p class="foot" id="foot"></p>
</main>
<main id="page" hidden>
  <div class="phead">
    <div class="pano" id="pano"></div>
    <div class="kicker" id="kicker"></div>
    <div class="pivots"><div class="strip" id="strip"></div></div>
  </div>
  <div class="panels" id="panels"></div>
</main>
<nav id="bar"></nav>
<div id="gate" hidden>
  <div class="kicker">METRO · PHONE</div>
  <h1 class="h1">the code</h1>
  <p class="dim">The TV is showing a four-digit code. Type it here once and this phone remembers it.</p>
  <div class="row"><input id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="one-time-code"><button class="go" id="codego">OK</button></div>
</div>
<div id="toast"></div>
<div id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div id="pull" aria-hidden="true"><span class="a">pull to refresh</span><span class="b">let go to refresh</span></div>
<script src="app.js?v=24"></script>
<script>
// Always the newest app: when it opens, and when it comes back on Start, it asks for its own page past every cache
// (the phone's, the CDN's), and if that page names a newer app.js it goes to it at an address no cache has. Tried
// once per version, so a server still handing out the old page can never make it loop.
(function () {
  var s = document.querySelector('script[src*="app.js"]'), mine = s && (s.getAttribute('src').match(/v=(\d+)/) || [])[1];
  if (!mine) return;
  var tv = location.port === '8796';
  function check(opening) {
    if (!opening && window.metroOnPage && window.metroOnPage()) return;
    var x = new XMLHttpRequest();
    x.open('GET', (tv ? '/' : 'index.html') + '?fresh=' + Date.now());
    x.onload = function () {
      var v = (x.responseText.match(/app\.js\?v=(\d+)/) || [])[1];
      if (!v || v === mine) return;
      var tried = (location.search.match(/[?&]v=(\d+)/) || [])[1];
      if (tried === v) return;
      location.replace(location.pathname + '?v=' + v + location.hash);
    };
    x.send();
  }
  check(true);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(false); });
  setInterval(function () { if (!document.hidden) check(false); }, 600000);
})();
</script>
</body>
</html>
